<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Linux-Inspired OS Login</title>
  <link rel="stylesheet" href="style.css" />

  <style>

    html, body, * {
      cursor: url('https://cur.cursors-4u.net/cursors/images4/cur330.png') 16 16, auto !important;
    }


    .taskbar {
      display: flex;
      justify-content: flex-end;  
      align-items: center;
      gap: 8px;  
      padding: 4px 12px; 
      background-color: rgba(0, 0, 0, 0.5);
      position: absolute;
      top: 0;
      right: 0;  
      height: 30px; 
      z-index: 10;
    }

    .taskbar img {
      width: 20px; 
      height: 20px;  
      transition: filter 0.3s ease, transform 0.3s ease;
      cursor: url('https://cur.cursors-4u.net/cursors/images4/cur330.png') 16 16, auto !important;
    }

    .taskbar img:hover {
      filter: brightness(1.5);
      transform: scale(1.1);  
    }

   
    button, input, img, span, div, a, .taskbar * {
      cursor: url('https://cur.cursors-4u.net/cursors/images4/cur330.png') 16 16, auto !important;
    }


    button, input, img, span, div, a {
      cursor: url('https://cur.cursors-4u.net/cursors/images4/cur330.png') 16 16, auto !important;
    }


    .shutdown-btn {
      background: url('https://cdn.discordapp.com/attachments/1125909892646043710/1361226151711735858/New20Project2011.png?ex=67fdfc24&is=67fcaaa4&hm=2c07f488a8200c0040c6e67485d75cc0e75310142300b709f52381ee6e257ecb&') no-repeat center center;
      background-size: contain;
      width: 20px;  
      height: 20px;  
      border: none;
      cursor: url('https://cur.cursors-4u.net/cursors/images4/cur330.png') 16 16, auto !important;
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    .shutdown-btn:hover {
      filter: brightness(1.5);
      transform: scale(1.1); 
    }

   
    .shutdown-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);  
      display: none;  
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .shutdown-text {
      color: white;
      font-size: 36px;
      font-family: Arial, sans-serif;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
  </style>

</head>
<body>
 
  <div class="fade-overlay hidden"></div>

  
  <div class="taskbar">
    <img src="https://cdn.discordapp.com/attachments/1125909892646043710/1361222311721570335/New20Project208.png?ex=67fdf891&is=67fca711&hm=039f12df75990521ba11cf3d42f83b25f90f83abaa35b1f8485c9420a4f17abd&" alt="Wi-Fi" />
    <img src="https://cdn.discordapp.com/attachments/1125909892646043710/1361224792056795187/New20Project2010.png?ex=67fdfae0&is=67fca960&hm=3742277d5412a5ce7143dc2775eaf2a192855daba970d2c2eb6afd55bb80125b&" alt="Volume" />
    <img src="https://cdn.discordapp.com/attachments/1125909892646043710/1361222852027875418/New20Project209.png?ex=67fdf912&is=67fca792&hm=85f6fa6a2cd2e32c024c9d58ec3016b6e68a7d4b025325179634c56977f58877&" alt="Battery" />
    <span id="clock">--:--</span>
  </div>

 
  <div class="user-selection">
    <div class="carousel-wrapper">
      <div class="user-carousel" id="user-carousel"></div>
    </div>
  </div>

 
  <div class="login-section">
    <div class="user-info">
      <img id="selected-user-img" alt="User Image" />
      <span id="selected-user-name"></span>
    </div>
    <input type="password" id="password" placeholder="Digite a senha" />
    <div class="login-error" id="login-error"></div>
    <button id="back-btn" class="back-btn">Voltar</button>
  </div>

 
  <button class="shutdown-btn"></button>

  
  <div class="shutdown-overlay">
    <div class="shutdown-text">Shutting down...</div>
  </div>


  <script src="script.js"></script>
  

  <script>
    document.getElementById("back-btn").addEventListener("click", function() {
      goBack();  
    });

    
    document.querySelector(".shutdown-btn").addEventListener("click", function() {
      
      const shutdownOverlay = document.querySelector(".shutdown-overlay");
      const shutdownText = document.querySelector(".shutdown-text");

      shutdownOverlay.style.display = "flex";
      setTimeout(() => {
        shutdownText.style.opacity = 1;  
      }, 100);


      setTimeout(() => {
        window.location.href = "https://www.google.com"; 
      }, 3000);
    });
  </script>
</body>
</html>
